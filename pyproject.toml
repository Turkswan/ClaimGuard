[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claimguard"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]  # only look for tests here (scripts/smoke_test.py is not a unit test)
pythonpath = ["src", "."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "B"]
