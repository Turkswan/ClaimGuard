name: ci

on:
  pull_request:
  push:
    branches: [main]

# Default: read-only. Jobs ask for more only when they need it.
permissions:
  contents: read

# A newer push to the same branch cancels the older, still-running pipeline.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Install dependencies
        run: |
          pip install -r requirements/dev.txt
          pip install -e . --no-deps
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest -q

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - name: Format check
        run: terraform fmt -check -recursive infra
      - name: Validate
        working-directory: infra/envs/dev
        run: |
          terraform init -backend=false -input=false
          terraform validate

  build:
    needs: [test, terraform]
    if: github.event_name == 'push' # only main builds images; PRs just test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets the job request an OIDC token for AWS
    strategy:
      matrix:
        image: [train, serve, mlflow]
    steps:
      - uses: actions/checkout@v7

      - name: Log in to AWS with OIDC (no stored keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/claimguard-${{ matrix.image }}:${{ github.sha }}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build -f docker/${{ matrix.image }}.Dockerfile -t "$IMAGE" .

      - name: Scan for critical vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.76.1 image --severity CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE"

      - name: Push
        run: docker push "$IMAGE"
