name: ci

on:
  pull_request:
  push:
    branches: [main]

# Default: read-only. Jobs ask for more only when they need it.
permissions:
  contents: read

# A newer push to the same branch cancels the older, still-running pipeline.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Install dependencies
        run: |
          pip install -r requirements/dev.txt
          pip install -e . --no-deps
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest -q

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - name: Format check
        run: terraform fmt -check -recursive infra
      - name: Validate
        working-directory: infra/envs/dev
        run: |
          terraform init -backend=false -input=false
          terraform validate

  build:
    needs: [test, terraform]
    if: github.event_name == 'push' # only main builds images; PRs just test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets the job request an OIDC token for AWS
    strategy:
      matrix:
        image: [train, serve, mlflow]
    steps:
      - uses: actions/checkout@v7
      - name: Debug GitHub identity
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch/ref: $GITHUB_REF"
          echo "Event: $GITHUB_EVENT_NAME"


      - name: Inspect OIDC claims
        shell: bash
        run: |
          TOKEN_JSON=$(curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          ID_TOKEN=$(echo "$TOKEN_JSON" | jq -r '.value')

          ID_TOKEN="$ID_TOKEN" python - <<'PY'
          import os
          import json
          import base64

          token = os.environ["ID_TOKEN"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(base64.urlsafe_b64decode(payload))

          selected = {
              key: claims.get(key)
              for key in [
                  "iss",
                  "aud",
                  "sub",
                  "repository",
                  "repository_id",
                  "repository_owner_id",
                  "ref"
              ]
          }

          print(json.dumps(selected, indent=2))
          PY      


      - name: Log in to AWS with OIDC (no stored keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/claimguard-${{ matrix.image }}:${{ github.sha }}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build -f docker/${{ matrix.image }}.Dockerfile -t "$IMAGE" .

      - name: Scan for critical vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.76.1 image --severity CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE"

      - name: Push
        run: docker push "$IMAGE"
